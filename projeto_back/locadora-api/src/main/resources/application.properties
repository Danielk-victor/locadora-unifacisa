# ==========================================
# Configuracoes da aplicacao - Locadora API
# ==========================================

server.port=8080

# Banco de dados H2 (em memoria) - ideal para estudo/testes
spring.datasource.url=jdbc:h2:mem:locadoradb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, acessivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
